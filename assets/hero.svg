<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="SAKU — Maker, Developer, Gunmaker from Thailand">
  <title>SAKU — Maker · Developer · Gunmaker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06203f"/><stop offset="1" stop-color="#0b3a6b"/>
    </linearGradient>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfe8ff" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#cfe8ff" stroke-opacity="0.16"/>
    </pattern>
    <linearGradient id="laser" x1="0" x2="1">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#5ee7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.25"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; fill: #cfe8ff; }
    .zone { font-size: 10px; text-anchor: middle; fill-opacity: .6; }
    .ticks line { stroke: #cfe8ff; stroke-opacity: .5; }
    .name { font-size: 132px; font-weight: 800; letter-spacing: 18px; fill: #cfe8ff; fill-opacity: 0;
             stroke: #cfe8ff; stroke-width: 2; stroke-dasharray: 900; stroke-dashoffset: 900;
             animation: draw 3.2s ease-out .3s forwards, fill 1.2s ease-in 2.6s forwards; }
    .role { font-size: 30px; font-weight: 700; letter-spacing: 6px; fill: #ffb703; }
    .label { font-size: 12px; letter-spacing: 2px; fill-opacity: .75; }
    .tb { font-size: 11px; letter-spacing: 1px; }
    .tbv { font-size: 13px; font-weight: 700; fill: #fff; }
    .dim { stroke: #cfe8ff; stroke-opacity: .7; fill: none; }
    .fade { opacity: 0; animation: fadein 1s ease-out forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; stroke-opacity: .35; } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

